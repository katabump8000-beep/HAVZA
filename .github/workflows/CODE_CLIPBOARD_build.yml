name: Build CODE CLIPBOARD APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate project and build APK
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.codeclipboard --project-name code_clipboard code_clipboard
          cd code_clipboard

          cat > lib/main.dart <<'DART'
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() => runApp(const CodeClipboardApp());

          class CodeClipboardApp extends StatelessWidget {
            const CodeClipboardApp({super.key});
            @override
            Widget build(BuildContext context) => MaterialApp(
              debugShowCheckedModeBanner: false,
              title: 'CODE CLIPBOARD',
              theme: ThemeData(
                brightness: Brightness.dark,
                scaffoldBackgroundColor: const Color(0xFF090D14),
                colorScheme: ColorScheme.fromSeed(
                  seedColor: const Color(0xFF3D8BFF),
                  brightness: Brightness.dark,
                ),
                useMaterial3: true,
              ),
              home: const HomePage(),
            );
          }

          class HomePage extends StatelessWidget {
            const HomePage({super.key});
            static const platform = MethodChannel('code_clipboard/system');

            Future<void> call(String method) async {
              try { await platform.invokeMethod(method); }
              on PlatformException catch (e) { debugPrint(e.message); }
            }

            @override
            Widget build(BuildContext context) => Scaffold(
              appBar: AppBar(title: const Text('CODE CLIPBOARD')),
              body: Padding(
                padding: const EdgeInsets.all(22),
                child: Column(
                  crossAxisAlignment: CrossAxisAlignment.stretch,
                  children: [
                    const SizedBox(height: 24),
                    const Icon(Icons.content_paste_go_rounded,
                        size: 76, color: Color(0xFF58A6FF)),
                    const SizedBox(height: 18),
                    const Text('حافظتك البرمجية',
                        textAlign: TextAlign.center,
                        style: TextStyle(fontSize: 25, fontWeight: FontWeight.bold)),
                    const SizedBox(height: 12),
                    const Text(
                      'فعّل لوحة CODE CLIPBOARD من إعدادات أندرويد، '
                      'ثم اخترها من قائمة لوحات المفاتيح.',
                      textAlign: TextAlign.center,
                      style: TextStyle(color: Colors.white70, height: 1.6)),
                    const SizedBox(height: 30),
                    FilledButton.icon(
                      onPressed: () => call('openImeSettings'),
                      icon: const Icon(Icons.settings),
                      label: const Text('فتح إعدادات لوحات المفاتيح')),
                    const SizedBox(height: 12),
                    OutlinedButton.icon(
                      onPressed: () => call('showImePicker'),
                      icon: const Icon(Icons.keyboard_alt_outlined),
                      label: const Text('اختيار لوحة CODE CLIPBOARD')),
                    const Spacer(),
                    const Text(
                      'قد يقيّد أندرويد قراءة الحافظة في بعض التطبيقات. '
                      'يُحفظ السجل محلياً على الجهاز.',
                      textAlign: TextAlign.center,
                      style: TextStyle(color: Colors.white38, fontSize: 12)),
                  ],
                ),
              ),
            );
          }
          DART

          cat > android/app/src/main/kotlin/com/codeclipboard/code_clipboard/MainActivity.kt <<'KOTLIN'
          package com.codeclipboard.code_clipboard

          import android.content.Intent
          import android.provider.Settings
          import android.view.inputmethod.InputMethodManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity : FlutterActivity() {
              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger,
                      "code_clipboard/system").setMethodCallHandler { call, result ->
                      when (call.method) {
                          "openImeSettings" -> {
                              startActivity(Intent(Settings.ACTION_INPUT_METHOD_SETTINGS))
                              result.success(true)
                          }
                          "showImePicker" -> {
                              (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                                  .showInputMethodPicker()
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }
          }
          KOTLIN

          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/method.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:supportsSwitchingToNextInputMethod="true"
              android:isDefault="false" />
          XML

          cat > android/app/src/main/kotlin/com/codeclipboard/code_clipboard/CodeClipboardImeService.kt <<'KOTLIN'
          package com.codeclipboard.code_clipboard

          import android.content.ClipboardManager
          import android.content.Context
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.inputmethodservice.InputMethodService
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.HorizontalScrollView
          import android.widget.LinearLayout
          import android.widget.TextView
          import org.json.JSONArray
          import org.json.JSONObject

          data class ClipItem(val text: String, val copiedAt: Long)

          class CodeClipboardImeService : InputMethodService() {
              private val prefs by lazy {
                  getSharedPreferences("code_clipboard_history", Context.MODE_PRIVATE)
              }
              private val clips = mutableListOf<ClipItem>()
              private var historyView: LinearLayout? = null

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()

              override fun onCreate() {
                  super.onCreate()
                  loadHistory()
              }

              override fun onStartInputView(
                  info: android.view.inputmethod.EditorInfo?,
                  restarting: Boolean
              ) {
                  super.onStartInputView(info, restarting)
                  captureCurrentClipboard()
                  renderHistory()
              }

              override fun onCreateInputView(): View {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), dp(9), dp(10), dp(10))
                      minimumHeight = dp(245)
                      setBackgroundColor(Color.rgb(12, 18, 29))
                  }

                  val heading = TextView(this).apply {
                      text = "CODE CLIPBOARD  •  سجل الحافظة"
                      textSize = 15f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.rgb(230, 238, 250))
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(5), dp(2), dp(5), dp(9))
                  }
                  root.addView(heading)

                  val firstRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  firstRow.addView(actionButton("تحديد الكل") {
                      currentInputConnection?.performContextMenuAction(android.R.id.selectAll)
                  }, actionParams())
                  firstRow.addView(actionButton("نسخ") {
                      currentInputConnection?.performContextMenuAction(android.R.id.copy)
                  }, actionParams())
                  root.addView(firstRow)

                  val secondRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }
                  secondRow.addView(actionButton("حذف المحدد") {
                      currentInputConnection?.performContextMenuAction(android.R.id.cut)
                  }, actionParams())
                  secondRow.addView(actionButton("تبديل الكيبورد") {
                      (getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager)
                          .showInputMethodPicker()
                  }, actionParams())
                  root.addView(secondRow)

                  val sectionTitle = TextView(this).apply {
                      text = "آخر المقاطع المنسوخة  —  اضغط على مقطع للصقه"
                      textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.rgb(151, 177, 210))
                      setPadding(dp(5), dp(11), dp(5), dp(7))
                  }
                  root.addView(sectionTitle)

                  val scroll = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                  }
                  historyView = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  scroll.addView(historyView)
                  root.addView(scroll, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, dp(100)
                  ))

                  return root
              }

              private fun actionParams() = LinearLayout.LayoutParams(
                  0, dp(48), 1f
              ).apply {
                  setMargins(dp(3), dp(3), dp(3), dp(3))
              }

              private fun actionButton(label: String, action: () -> Unit) =
                  Button(this).apply {
                      text = label
                      textSize = 14f
                      isAllCaps = false
                      minHeight = dp(48)
                      setTextColor(Color.WHITE)
                      setPadding(dp(8), 0, dp(8), 0)
                      background = GradientDrawable().apply {
                          setColor(Color.rgb(39, 58, 83))
                          cornerRadius = dp(12).toFloat()
                      }
                      setOnClickListener { action() }
                  }

              private fun loadHistory() {
                  clips.clear()
                  val raw = prefs.getString("items", "[]") ?: "[]"
                  try {
                      val array = JSONArray(raw)
                      for (i in 0 until array.length()) {
                          val value = array.get(i)
                          if (value is JSONObject) {
                              val text = value.optString("text", "")
                              val time = value.optLong("copiedAt", System.currentTimeMillis())
                              if (text.isNotBlank()) clips.add(ClipItem(text, time))
                          } else if (value is String && value.isNotBlank()) {
                              // Compatibility with entries saved by the first app version.
                              clips.add(ClipItem(value, System.currentTimeMillis()))
                          }
                      }
                  } catch (_: Exception) { }
              }

              private fun saveHistory() {
                  val array = JSONArray()
                  clips.forEach { item ->
                      array.put(JSONObject().put("text", item.text).put("copiedAt", item.copiedAt))
                  }
                  prefs.edit().putString("items", array.toString()).apply()
              }

              private fun captureCurrentClipboard() {
                  val manager = getSystemService(CLIPBOARD_SERVICE) as ClipboardManager
                  val value = try {
                      if (manager.hasPrimaryClip()) {
                          manager.primaryClip?.getItemAt(0)?.coerceToText(this)?.toString()
                      } else null
                  } catch (_: Exception) { null }

                  if (!value.isNullOrBlank() && clips.firstOrNull()?.text != value) {
                      clips.removeAll { it.text == value }
                      clips.add(0, ClipItem(value, System.currentTimeMillis()))
                      saveHistory()
                  }
              }

              private fun elapsed(timestamp: Long): String {
                  val seconds = ((System.currentTimeMillis() - timestamp).coerceAtLeast(0L) / 1000L)
                  return when {
                      seconds < 60 -> "منذ ${seconds} ثانية"
                      seconds < 3600 -> "منذ ${seconds / 60} دقيقة"
                      seconds < 86400 -> "منذ ${seconds / 3600} ساعة"
                      else -> "منذ ${seconds / 86400} يوم"
                  }
              }

              private fun renderHistory() {
                  val row = historyView ?: return
                  row.removeAllViews()

                  if (clips.isEmpty()) {
                      row.addView(TextView(this).apply {
                          text = "لا توجد مقاطع بعد — انسخ نصاً ثم افتح الحافظة"
                          textSize = 13f
                          setTextColor(Color.LTGRAY)
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(dp(10), 0, dp(10), 0)
                      })
                      return
                  }

                  clips.forEachIndexed { index, item ->
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(dp(12), dp(8), dp(12), dp(8))
                          background = GradientDrawable().apply {
                              setColor(Color.rgb(27, 39, 57))
                              cornerRadius = dp(13).toFloat()
                              setStroke(dp(1), Color.rgb(57, 79, 108))
                          }
                          isClickable = true
                          isFocusable = true
                          setOnClickListener {
                              currentInputConnection?.commitText(item.text, 1)
                          }
                      }

                      val preview = TextView(this).apply {
                          text = "${index + 1}. ${item.text.replace('\n', ' ').replace('\r', ' ').take(34)}"
                          textSize = 13f
                          typeface = Typeface.MONOSPACE
                          setTextColor(Color.rgb(240, 245, 252))
                          maxLines = 2
                      }
                      val time = TextView(this).apply {
                          text = elapsed(item.copiedAt)
                          textSize = 12f
                          setTextColor(Color.rgb(91, 190, 255))
                          setPadding(0, dp(5), 0, 0)
                      }

                      card.addView(preview)
                      card.addView(time)
                      val params = LinearLayout.LayoutParams(dp(245), dp(88)).apply {
                          setMargins(dp(3), dp(2), dp(7), dp(2))
                      }
                      row.addView(card, params)
                  }
              }
          }
          KOTLIN

          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          data = manifest.read_text()
          service = '''
                  <service
                      android:name=".CodeClipboardImeService"
                      android:label="CODE CLIPBOARD"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>
          '''
          data = data.replace("</application>", service + "\\n    </application>")
          manifest.write_text(data)
          PY

          flutter pub get
          flutter build apk --release

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CODE-CLIPBOARD-APK
          path: code_clipboard/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
