package com.codeclipboard.code_clipboard

import android.content.ClipboardManager
import android.content.Context
import android.graphics.Color
import android.graphics.Typeface
import android.inputmethodservice.InputMethodService
import android.os.Build
import android.text.InputType
import android.view.Gravity
import android.view.KeyEvent
import android.view.View
import android.view.ViewGroup
import android.view.inputmethod.EditorInfo
import android.view.inputmethod.InputConnection
import android.widget.Button
import android.widget.FrameLayout
import android.widget.HorizontalScrollView
import android.widget.LinearLayout
import android.widget.ScrollView
import android.widget.TextView
import android.widget.Toast
import org.json.JSONArray
import org.json.JSONObject
import java.text.SimpleDateFormat
import java.util.Date
import java.util.Locale

/**
 * بيانات عنصر واحد في سجل الحافظة.
 */
data class ClipItem(
    val text: String,
    val copiedAt: Long = System.currentTimeMillis()
)

/**
 * خدمة لوحة مفاتيح بسيطة (IME) تعرض سجل الحافظة فوق الكيبورد
 * وتسمح بإدخال النصوص المخزنة.
 */
class CodeClipboardImeService : InputMethodService() {

    // ---------------------------------------------------------------------
    // State
    // ---------------------------------------------------------------------

    /** سجل العناصر المنسوخة (الأحدث أولاً). */
    private val clips: MutableList<ClipItem> = mutableListOf()

    /** الحاوية الرئيسية لعرض السجل فوق الكيبورد (nullable). */
    private var historyView: LinearLayout? = null

    /** الحاوية الجذرية للـ keyboard view. */
    private var rootView: LinearLayout? = null

    private val prefsName = "code_clipboard_ime_prefs"
    private val prefsKey  = "clip_history_v1"
    private val maxClips  = 50

    // ---------------------------------------------------------------------
    // Lifecycle
    // ---------------------------------------------------------------------

    override fun onCreate() {
        super.onCreate()
        loadHistory()
    }

    override fun onCreateInputView(): View {
        val root = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setBackgroundColor(Color.parseColor("#1E1E1E"))
            layoutParams = ViewGroup.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                ViewGroup.LayoutParams.WRAP_CONTENT
            )
        }
        rootView = root

        // شريط علوي بسيط
        val topBar = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            setPadding(dp(8), dp(6), dp(8), dp(6))
            setBackgroundColor(Color.parseColor("#252526"))
        }

        val title = TextView(this).apply {
            text = "Code Clipboard"
            setTextColor(Color.WHITE)
            textSize = 14f
            typeface = Typeface.DEFAULT_BOLD
            layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
        }

        val clearBtn = Button(this).apply {
            text = "مسح"
            textSize = 12f
            setOnClickListener { clearHistory() }
        }

        topBar.addView(title)
        topBar.addView(clearBtn)
        root.addView(topBar)

        // منطقة السجل
        val historyContainer = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
            setPadding(dp(8), dp(8), dp(8), dp(8))
            setBackgroundColor(Color.parseColor("#1E1E1E"))
        }
        historyView = historyContainer
        root.addView(historyContainer)

        // إعادة رسم السجل
        renderHistory()

        // شريط المفاتيح الأساسي (Enter + Backspace + Space)
        root.addView(buildKeyBar())

        return root
    }

    // ---------------------------------------------------------------------
    // Key bar
    // ---------------------------------------------------------------------

    private fun buildKeyBar(): View {
        val row = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            setBackgroundColor(Color.parseColor("#252526"))
            setPadding(dp(6), dp(6), dp(6), dp(6))
        }

        row.addView(makeKey("مسافة") {
            currentInputConnection?.commitText(" ", 1)
        })
        row.addView(makeKey("Enter") {
            val ic = currentInputConnection ?: return@makeKey
            ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, KeyEvent.KEYCODE_ENTER))
            ic.sendKeyEvent(KeyEvent(KeyEvent.ACTION_UP,   KeyEvent.KEYCODE_ENTER))
        })
        row.addView(makeKey("⌫") {
            currentInputConnection?.deleteSurroundingText(1, 0)
        })
        row.addView(makeKey("إغلاق") {
            requestHideSelf(0)
        })

        return row
    }

    private fun makeKey(label: String, onClick: () -> Unit): Button {
        return Button(this).apply {
            text = label
            textSize = 13f
            isAllCaps = false
            layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                .apply { marginStart = dp(4); marginEnd = dp(4) }
            setOnClickListener { onClick() }
        }
    }

    // ---------------------------------------------------------------------
    // History rendering
    // ---------------------------------------------------------------------

    private fun renderHistory() {
        val container = historyView ?: return
        container.removeAllViews()

        if (clips.isEmpty()) {
            val empty = TextView(this).apply {
                text = "لا يوجد سجل بعد."
                setTextColor(Color.parseColor("#AAAAAA"))
                textSize = 13f
                gravity = Gravity.CENTER
                setPadding(dp(8), dp(16), dp(8), dp(16))
            }
            container.addView(empty)
            return
        }

        val scroll = ScrollView(this).apply {
            layoutParams = LinearLayout.LayoutParams(
                ViewGroup.LayoutParams.MATCH_PARENT,
                dp(180)
            )
        }
        val list = LinearLayout(this).apply {
            orientation = LinearLayout.VERTICAL
        }

        clips.forEachIndexed { index, item ->
            val row = LinearLayout(this).apply {
                orientation = LinearLayout.HORIZONTAL
                setPadding(dp(6), dp(6), dp(6), dp(6))
                setBackgroundColor(
                    if (index % 2 == 0) Color.parseColor("#252526")
                    else Color.parseColor("#2D2D30")
                )
            }

            val textView = TextView(this).apply {
                text = item.text
                setTextColor(Color.WHITE)
                textSize = 13f
                maxLines = 2
                ellipsize = android.text.TextUtils.TruncateAt.END
                layoutParams = LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                setOnClickListener {
                    commitClip(item.text)
                }
            }

            val dateView = TextView(this).apply {
                text = formatTime(item.copiedAt)
                setTextColor(Color.parseColor("#888888"))
                textSize = 10f
                setPadding(dp(6), 0, dp(6), 0)
            }

            val deleteBtn = Button(this).apply {
                text = "✕"
                textSize = 12f
                minWidth = 0
                minimumWidth = 0
                setPadding(dp(6), 0, dp(6), 0)
                setOnClickListener {
                    clips.removeAt(index)
                    saveHistory()
                    renderHistory()
                }
            }

            row.addView(textView)
            row.addView(dateView)
            row.addView(deleteBtn)
            list.addView(row)
        }

        scroll.addView(list)
        container.addView(scroll)
    }

    // ---------------------------------------------------------------------
    // Insert clip
    // ---------------------------------------------------------------------

    private fun commitClip(text: String) {
        val ic: InputConnection = currentInputConnection ?: return
        ic.commitText(text, 1)
        // انقل العنصر إلى الأعلى (الأحدث)
        val existing = clips.find { it.text == text }
        if (existing != null) {
            clips.remove(existing)
            clips.add(0, existing.copy(copiedAt = System.currentTimeMillis()))
        } else {
            clips.add(0, ClipItem(text))
        }
        if (clips.size > maxClips) {
            while (clips.size > maxClips) clips.removeAt(clips.size - 1)
        }
        saveHistory()
        renderHistory()
    }

    // ---------------------------------------------------------------------
    // Capture clipboard changes
    // ---------------------------------------------------------------------

    override fun onStartInputView(info: EditorInfo?, restarting: Boolean) {
        super.onStartInputView(info, restarting)
        captureClipboard()
        renderHistory()
    }

    private fun captureClipboard() {
        try {
            val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
            val clip = cm.primaryClip ?: return
            if (clip.itemCount == 0) return
            val text = clip.getItemAt(0).coerceToText(this)?.toString() ?: return
            if (text.isBlank()) return
            if (clips.isNotEmpty() && clips[0].text == text) return

            clips.add(0, ClipItem(text))
            if (clips.size > maxClips) {
                while (clips.size > maxClips) clips.removeAt(clips.size - 1)
            }
            saveHistory()
            renderHistory()
        } catch (_: Exception) {
            // تجاهل
        }
    }

    // ---------------------------------------------------------------------
    // Persistence
    // ---------------------------------------------------------------------

    private fun saveHistory() {
        try {
            val arr = JSONArray()
            clips.forEach { item ->
                val obj = JSONObject()
                obj.put("text", item.text)
                obj.put("copiedAt", item.copiedAt)
                arr.put(obj)
            }
            getSharedPreferences(prefsName, Context.MODE_PRIVATE)
                .edit()
                .putString(prefsKey, arr.toString())
                .apply()
        } catch (_: Exception) {
            // تجاهل
        }
    }

    private fun loadHistory() {
        try {
            val json = getSharedPreferences(prefsName, Context.MODE_PRIVATE)
                .getString(prefsKey, null) ?: return
            val arr = JSONArray(json)
            clips.clear()
            for (i in 0 until arr.length()) {
                val obj = arr.getJSONObject(i)
                clips.add(
                    ClipItem(
                        text = obj.optString("text", ""),
                        copiedAt = obj.optLong("copiedAt", System.currentTimeMillis())
                    )
                )
            }
        } catch (_: Exception) {
            clips.clear()
        }
    }

    private fun clearHistory() {
        clips.clear()
        saveHistory()
        renderHistory()
        Toast.makeText(this, "تم مسح السجل", Toast.LENGTH_SHORT).show()
    }

    // ---------------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------------

    private fun formatTime(ts: Long): String {
        val fmt = SimpleDateFormat("HH:mm", Locale.getDefault())
        return fmt.format(Date(ts))
    }

    /** تحويل dp إلى px. */
    private fun dp(value: Int): Int {
        return (value * resources.displayMetrics.density).toInt()
    }

    /** امتداد اختياري للاستخدامات المستقبلية. */
    private val Int.dpValue: Int
        get() = dp(this)
}
